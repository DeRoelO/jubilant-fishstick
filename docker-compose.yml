version: '3.8'

services:
  eisenhower-app:
    build: .
    container_name: eisenhower-tasks
    restart: always
    ports:
      - "3005:3000"
    volumes:
      # Hier mappen we een mapje op je host (LXC) naar de container voor SQLite opslag.
      # Zorg ervoor dat ./prisma_data bestaat op je LXC en voldoende rechten heeft.
      - ./prisma_data:/app/prisma/data
      
  # Voorbeeld van database service als we later SQLite willen vervangen met PostgreSQL:
